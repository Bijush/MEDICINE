<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="css/module.css">

</head>
<body>

<h2>📚 Disease Theory</h2>

<input 
  id="search" 
  placeholder="Search disease..." 
  oninput="searchData(this.value)"
>

<!-- 🔥 FILTER -->
<div class="filter-box">

  <div class="filter-input" onclick="toggleDropdown(event)">
    <span id="filterText">All</span>
    <span>▼</span>
  </div>

  <div id="filterDropdown" class="dropdown hidden">

    <input 
      placeholder="Search filter..." 
      oninput="filterSearchList(this.value)"
    >

    <div id="filterOptions"></div>

  </div>

</div>

<!-- LIST -->
<div id="list"></div>

<script type="module" src="js/theory/theory.js"></script>

</body>
</html>
