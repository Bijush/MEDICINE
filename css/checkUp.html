<!DOCTYPE html>
<html>
<head>
  <title>AI Diagnosis</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/module.css">
  <link rel="stylesheet" href="css/checkup.css">
</head>

<body>

<div class="container">

  <h2>🧠 AI Doctor Diagnosis</h2>

  <div class="filter-box">

    <div id="filterText" class="filter-input" onclick="window.toggleDropdown(event)">
      Select Symptoms
    </div>

    <!-- 🔥 CLASS CHANGED -->
    <div id="filterDropdown" class="checkup-dropdown hidden" onclick="event.stopPropagation()">

      <div class="dropdown-header">
        <span>Select Symptoms</span>
        <button onclick="window.closeDropdown()">✖</button>
      </div>

      <input 
        type="text" 
        placeholder="Search symptoms..." 
        oninput="window.filterSearchList?.(this.value)"
      />

      <div id="filterOptions"></div>

    </div>

  </div>

  <button onclick="window.startDiagnosis()">Start Diagnosis</button>

  <div id="result"></div>

</div>

<script type="module" src="js/checkup/checkup.js"></script>

</body>
</html>
