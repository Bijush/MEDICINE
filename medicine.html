<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💊 Medicine</title>

  <!-- 🔥 GLOBAL -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 🔥 MODULE UI -->
  <link rel="stylesheet" href="css/module.css">
</head>

<body>

<!-- 🔥 PAGE HEADER -->
<div class="top">

  <h2>💊 Medicine</h2>

  <!-- 🔍 SEARCH (IMPORTANT FIX) -->
  <input id="search" placeholder="Search medicine..." />
<!-- 🔥 NEW MEDICAL FILTER -->
<div class="filter-box medical-filter-box">

  <!-- 🔥 HEADER -->

  <div
    class="filter-input"
    onclick="
      toggleMedicalDropdown(event)
    ">

    <span id="medicalFilterText">

      Select Medical Filters

    </span>

    <span class="arrow">

      ▼

    </span>

  </div>


  <!-- 🔥 DROPDOWN -->

  <div
    id="medicalFilterDropdown"
    class="dropdown hidden">


    <!-- 🔍 SEARCH -->

    <input

      id="medicalFilterSearch"

      class="filter-search"

      placeholder="
        Search medical filters...
      "

      oninput="
        filterMedicalList(
          this.value
        )
      "
    />


    <!-- 🔥 OPTIONS -->

    <div
      id="medicalFilterOptions">

    </div>

  </div>

</div>
</div>


<!-- 🔥 CATEGORY FILTER -->
<div class="filter-box">

  <div class="filter-input" onclick="toggleDropdown(event)">
    <span id="filterText">Select Category</span>
    <span>▼</span>
  </div>

  <div id="filterDropdown" class="dropdown hidden">

    <!-- 🔍 SEARCH -->
    <input 
      id="filterSearch" 
      placeholder="Search category..." 
      oninput="filterSearchList(this.value)"
    />

    <!-- ✅ OPTIONS -->
    <div id="filterOptions"></div>

  </div>

</div>

<!-- 🔥 MAIN LIST -->
<div id="list"></div>

<!-- 🔥 FIREBASE SDK (ADD THIS FIRST) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>


<!-- 🔥 REQUIRED SCRIPTS -->
<script src="js/firebase/firebase.js"></script>
<script src="js/firebase/auth.js"></script>

<!-- 🔥 MODULE SYSTEM -->
<script type="module" src="js/medicine/medicine.js"></script>

</body>
</html>
